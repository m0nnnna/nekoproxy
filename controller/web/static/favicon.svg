<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Left ear -->
  <polygon points="8,28 2,4 22,20" fill="#f472b6"/>
  <polygon points="10,26 6,10 20,20" fill="#fbcfe8"/>
  <!-- Right ear -->
  <polygon points="56,28 62,4 42,20" fill="#f472b6"/>
  <polygon points="54,26 58,10 44,20" fill="#fbcfe8"/>
  <!-- Head -->
  <circle cx="32" cy="38" r="24" fill="#fce7f3"/>
  <!-- Eyes -->
  <ellipse cx="22" cy="35" rx="4" ry="4.5" fill="#831843"/>
  <ellipse cx="42" cy="35" rx="4" ry="4.5" fill="#831843"/>
  <!-- Eye shine -->
  <circle cx="24" cy="33" r="1.5" fill="white"/>
  <circle cx="44" cy="33" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="32" cy="42" rx="2" ry="1.5" fill="#ec4899"/>
  <!-- Mouth -->
  <path d="M28,44 Q32,48 36,44" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="4" y1="36" x2="18" y2="38" stroke="#f9a8d4" stroke-width="1.2"/>
  <line x1="4" y1="42" x2="18" y2="42" stroke="#f9a8d4" stroke-width="1.2"/>
  <line x1="46" y1="38" x2="60" y2="36" stroke="#f9a8d4" stroke-width="1.2"/>
  <line x1="46" y1="42" x2="60" y2="42" stroke="#f9a8d4" stroke-width="1.2"/>
</svg>
