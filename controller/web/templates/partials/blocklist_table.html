{% for entry in entries %}
<tr id="blocklist-{{ entry.ip | replace('.', '-') }}">
    <td class="whitespace-nowrap font-medium text-neko-900">{{ entry.ip }}</td>
    <td class="text-neko-600">{{ entry.reason or '-' }}</td>
    <td class="whitespace-nowrap text-neko-400">
        {{ entry.added_at.strftime('%Y-%m-%d %H:%M:%S') }}
    </td>
    <td class="whitespace-nowrap">
        <button hx-delete="/blocklist/{{ entry.ip }}"
                hx-target="#blocklist-{{ entry.ip | replace('.', '-') }}"
                hx-swap="outerHTML"
                hx-confirm="Unblock this IP? Are you sure ~nya?"
                class="neko-action-green font-semibold text-sm">
            Unblock
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="4" class="text-center py-8 neko-empty">
        No blocked IPs (=^.^=) Add an IP above to block it!
    </td>
</tr>
{% endfor %}
