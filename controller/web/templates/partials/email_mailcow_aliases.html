{% if aliases %}
{% for alias in aliases %}
<tr>
    <td class="whitespace-nowrap text-sm font-semibold text-neko-900">{{ alias.address }}</td>
    <td class="whitespace-nowrap text-sm text-neko-500">{{ alias.goto }}</td>
    <td class="whitespace-nowrap text-sm">
        {% if alias.active == 1 or alias.active == '1' %}
        <span class="neko-badge neko-badge-healthy">Active</span>
        {% else %}
        <span class="neko-badge neko-badge-low">Inactive</span>
        {% endif %}
    </td>
    <td class="whitespace-nowrap text-sm">
        <button hx-delete="/email/mailcow/aliases/{{ alias.id }}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Delete alias {{ alias.address }}? ~nya"
                class="neko-action-red font-semibold">
            Delete
        </button>
    </td>
</tr>
{% endfor %}
{% else %}
<tr>
    <td colspan="4" class="text-center py-8 neko-empty">
        No aliases found (=^.^=) Make sure Mailcow API is configured!
    </td>
</tr>
{% endif %}
