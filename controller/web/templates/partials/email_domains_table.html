{% for domain in domains %}
<tr>
    <td class="whitespace-nowrap">
        <button hx-post="/email/domains/{{ domain.id }}/toggle"
                hx-target="#domains-table"
                hx-swap="innerHTML"
                class="text-sm {% if domain.enabled %}text-green-500{% else %}text-neko-300{% endif %}">
            {% if domain.enabled %}
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            {% else %}
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
            {% endif %}
        </button>
    </td>
    <td class="whitespace-nowrap text-sm font-semibold text-neko-900">{{ domain.domain }}</td>
    <td class="whitespace-nowrap text-sm">
        {% if domain.mailcow_managed %}
        <span class="neko-badge neko-badge-purple">Mailcow</span>
        {% else %}
        <span class="neko-badge neko-badge-low">Manual</span>
        {% endif %}
    </td>
    <td class="whitespace-nowrap text-sm">
        <button hx-delete="/email/domains/{{ domain.id }}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Delete domain {{ domain.domain }}? ~nya"
                class="neko-action-red font-semibold">
            Delete
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="4" class="text-center py-8 neko-empty">No relay domains configured (=^.^=)</td>
</tr>
{% endfor %}
